[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[project]
name = "typf"
dynamic = ["version"]
description = "High-performance text rendering pipeline"
authors = [{name = "FontLab", email = "dev@fontlab.com"}]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Text Processing :: Fonts",
]

dependencies = [
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-benchmark>=4.0",
    "pillow>=10.0",
    "numpy>=1.20",
]

[project.scripts]
typf = "typfpy.cli:main"
typfpy = "typfpy.cli:main"

[tool.maturin]
auditwheel = "repair"
module-name = "typfpy.typf"
python-source = "python"
python-packages = ["typf", "typfpy"]
exclude = ["**/__pycache__/**", "**/*.pyc", "**/.DS_Store", "**/.env", "**/CLAUDE.md", "**/AGENTS.md", "**/WORK.md", "**/REVIEW.md", "**/TASKS.md", "**/.superpowers/**", "**/.omc/**", "**/.codegraph/**"]
features = ["pyo3/extension-module", "shaping-hb", "render-opixa", "export-png", "export-svg", "linra-mac", "linra-win", "render-vello-cpu", "render-vello"]

# SBOM generators currently record absolute local Cargo package paths.
[tool.maturin.sbom]
rust = false
auditwheel = false
