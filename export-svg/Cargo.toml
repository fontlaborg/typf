[package]
exclude = ["**/CLAUDE.md", "**/AGENTS.md", "**/WORK.md", "**/REVIEW.md", "**/TASKS.md", "**/.env", "**/.DS_Store", "**/__pycache__/**", "**/*.pyc", "**/*.log"]
name = "typf-export-svg"
version.workspace = true
rust-version.workspace = true
authors.workspace = true
edition.workspace = true
description = "SVG export support for Typf"
repository.workspace = true
license.workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"

[dependencies]
base64 = { version = "0.22", optional = true }
read-fonts = { workspace = true }
skrifa = { workspace = true }
thiserror.workspace = true
typf-core = { workspace = true }
typf-render-color = { workspace = true, optional = true }

[features]
default = []
# Enable embedding bitmap glyphs as base64 PNG images in SVG
bitmap-embed = ["dep:base64", "dep:typf-render-color", "typf-render-color/bitmap"]
