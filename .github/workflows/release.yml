# this_file: .github/workflows/release.yml
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_only:
        description: Build downloadable artifacts without publishing
        type: boolean
        default: true
      version:
        description: Expected workspace version
        type: string
        default: '5.1.0'

permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # harfbuzz-sys otherwise picks up newer system dylibs and raises the OS floor.
  HARFBUZZ_SYS_NO_PKG_CONFIG: 1

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate checked-in version; never rewrite manifests in CI
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          expected="${EXPECTED_VERSION:-${GITHUB_REF_NAME#v}}"
          python scripts/release.py validate --version "$expected"
          python -m unittest discover -s scripts -p test_release.py

  wheels:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: x86_64, manylinux: '2_28'}
          - {os: ubuntu-24.04-arm, target: aarch64, manylinux: '2_28'}
          - {os: ubuntu-24.04, target: x86_64, manylinux: musllinux_1_2, container: 'quay.io/pypa/musllinux_1_2_x86_64:latest'}
          - {os: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2, container: 'quay.io/pypa/musllinux_1_2_aarch64:latest'}
          - {os: macos-15-intel, target: x86_64, manylinux: 'off'}
          - {os: macos-14, target: aarch64, manylinux: 'off'}
          - {os: windows-2022, target: x64, manylinux: 'off'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Remap private build paths
        shell: bash
        run: |
          workspace="$GITHUB_WORKSPACE"
          user_home="$HOME"
          if [[ "$RUNNER_OS" == Windows ]]; then
            workspace="$(cygpath -w "$GITHUB_WORKSPACE")"
            user_home="$(cygpath -w "$HOME")"
          fi
          echo "RUSTFLAGS=--remap-path-prefix=$workspace=/typf --remap-path-prefix=$user_home=/build --remap-path-prefix=/io=/typf --remap-path-prefix=/root=/build" >> "$GITHUB_ENV"
      - name: Build stable ABI wheel from the binding project
        uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/py
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          container: ${{ matrix.container || '' }}
          docker-options: -e HARFBUZZ_SYS_NO_PKG_CONFIG=1
          args: --locked --release --auditwheel repair --out ../../dist --interpreter ${{ runner.os == 'Linux' && 'python3.11' || 'python' }}
      - name: Audit wheel payload
        shell: bash
        run: python scripts/release.py audit dist/*.whl
      - name: Install smoke font
        if: runner.os == 'Linux' && matrix.manylinux == '2_28'
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - name: Install wheel and smoke render with a real font
        if: matrix.manylinux != 'musllinux_1_2'
        shell: bash
        run: |
          python -m pip install dist/*.whl
          python scripts/smoke_wheel.py
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/py
          command: sdist
          args: --out ../../dist
      - run: python scripts/release.py audit dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  binaries:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: x86_64-unknown-linux-gnu}
          - {os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu}
          - {os: macos-15-intel, target: x86_64-apple-darwin}
          - {os: macos-14, target: aarch64-apple-darwin}
          - {os: windows-2022, target: x86_64-pc-windows-msvc}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build CLI
        shell: bash
        run: |
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=/typf --remap-path-prefix=$HOME=/build"
          cargo build --locked --release -p typf-cli --target '${{ matrix.target }}'
      - name: Package binary
        shell: bash
        run: |
          mkdir -p dist
          if [[ "$RUNNER_OS" == Windows ]]; then
            cp target/${{ matrix.target }}/release/typf.exe dist/
          else
            tar -czf dist/typf-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release typf
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: rust-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish-crates:
    needs: [validate, wheels, sdist, binaries]
    if: github.event_name == 'push' || !inputs.build_only
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish every workspace crate in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: ./scripts/publish.sh --crates

  publish-pypi:
    needs: [wheels, sdist, publish-crates]
    if: github.event_name == 'push' || !inputs.build_only
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/typf/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [binaries, wheels, sdist, publish-pypi]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect assets and checksums
        run: |
          mkdir release-assets
          find artifacts -type f -exec cp {} release-assets/ \;
          cd release-assets
          sha256sum ./* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true
