[package]
exclude = ["**/CLAUDE.md", "**/AGENTS.md", "**/WORK.md", "**/REVIEW.md", "**/TASKS.md", "**/.env", "**/.DS_Store", "**/__pycache__/**", "**/*.pyc", "**/*.log"]
name = "typf-render-vello"
version.workspace = true
rust-version.workspace = true
authors.workspace = true
edition.workspace = true
description = "Vello GPU renderer backend for typf"
repository.workspace = true
license.workspace = true

[dependencies]
log = { workspace = true }
typf-core = { workspace = true }
vello_hybrid = { version = "=0.0.4", default-features = false, features = ["wgpu"] }
vello_common = { version = "=0.0.4", default-features = false, features = ["std", "text"] }
wgpu = { version = "26", default-features = false, features = ["std", "wgsl", "metal", "vulkan", "dx12"] }
pollster = "0.4"
thiserror = { workspace = true }

[dev-dependencies]
typf-fontdb = { workspace = true }
typf-shape-none = { workspace = true }

[lints]
workspace = true
