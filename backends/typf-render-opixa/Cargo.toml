[package]
exclude = ["**/CLAUDE.md", "**/AGENTS.md", "**/WORK.md", "**/REVIEW.md", "**/TASKS.md", "**/.env", "**/.DS_Store", "**/__pycache__/**", "**/*.pyc", "**/*.log"]
name = "typf-render-opixa"
version.workspace = true
rust-version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "Pure Rust rendering backend using Opixa rasterizer"
repository.workspace = true

[dependencies]
typf-core = { workspace = true }
log = { workspace = true }
rayon = { version = "1.8", optional = true }
read-fonts = { workspace = true }
skrifa = { workspace = true }
typftth = { workspace = true, optional = true }

[features]
default = ["tth"]
parallel = ["rayon"]
# TrueType hinting via the typftth interpreter (HintingMode::TrueType)
tth = ["dep:typftth"]