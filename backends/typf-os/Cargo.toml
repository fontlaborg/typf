[package]
exclude = ["**/CLAUDE.md", "**/AGENTS.md", "**/WORK.md", "**/REVIEW.md", "**/TASKS.md", "**/.env", "**/.DS_Store", "**/__pycache__/**", "**/*.pyc", "**/*.log"]
name = "typf-os"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
description = "Platform-native linra text rendering dispatcher"
license.workspace = true
repository.workspace = true
keywords = ["font", "text", "rendering", "platform"]
categories = ["graphics", "text-processing"]

[dependencies]
typf-core = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
typf-os-mac = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
typf-os-win = { workspace = true }

[features]
default = []
