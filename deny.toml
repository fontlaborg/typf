# cargo-deny configuration
# Run with: cargo deny check

[advisories]
version = 2
unmaintained = "workspace"
yanked = "warn"
# pyo3 0.22 advisories. Neither affected API (`PyString::from_object`,
# `PyCFunction::new_closure`) is used by typf. Remove once pyo3 is upgraded.
ignore = [
    "RUSTSEC-2025-0020",
    "RUSTSEC-2026-0177",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Zlib",
]

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 }
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

# Skip duplicate versions we can't avoid yet
skip = []

# Skip tree checking for these
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
